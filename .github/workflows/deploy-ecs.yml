name: Deploy ECS

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ecs-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_BASE_PATH: /liangliang-developer/baby-growth-desk
  APP_PORT: "3101"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test and build standalone runtime
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.APP_BASE_PATH }}
        run: npm test

      - name: Validate production bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s dist/standalone/server.js
          test -s dist/standalone/dist/server/index.js
          test -d dist/standalone/dist/client
          test -d dist/standalone/node_modules/vinext
          grep -q 'mysql2' dist/standalone/dist/server/index.js

      - name: Package production bundle
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -C dist/standalone -czf "$RUNNER_TEMP/baby-growth-desk-release.tgz" .

      - name: Upload production bundle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: baby-growth-desk-release
          path: ${{ runner.temp }}/baby-growth-desk-release.tgz
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Download production bundle
        uses: actions/download-artifact@v4
        with:
          name: baby-growth-desk-release
          path: ${{ runner.temp }}/release

      - name: Validate deployment contract
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_KNOWN_HOSTS DEPLOY_PATH SSH_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required deployment value is unavailable: ${name}" >&2
              exit 1
            fi
          done
          if [[ ! "$DEPLOY_PATH" =~ ^/var/www/[A-Za-z0-9._/-]+$ ]] || [[ "$DEPLOY_PATH" == *".."* ]]; then
            echo "DEPLOY_PATH is outside the approved project directory shape" >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/release/baby-growth-desk-release.tgz"

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/deploy_key"

      - name: Upload immutable release
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -se -- "$DEPLOY_PATH" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path=$1
          test -d "$deploy_path/incoming"
          test -d "$deploy_path/releases"
          test -w "$deploy_path/incoming"
          test -w "$deploy_path/releases"
          REMOTE
          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -P "$DEPLOY_PORT" \
            "$RUNNER_TEMP/release/baby-growth-desk-release.tgz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/incoming/$release_id.tgz"

      - name: Publish, restart, and verify locally
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -se -- "$DEPLOY_PATH" "$RELEASE_ID" "$APP_PORT" "$APP_BASE_PATH" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path=$1
          release_id=$2
          app_port=$3
          app_base_path=$4
          archive="$deploy_path/incoming/$release_id.tgz"
          release="$deploy_path/releases/$release_id"
          current_link="$deploy_path/current"
          next_link="$deploy_path/current.next"
          known_good_file="$deploy_path/known-good-release"
          current_before=""
          rollback_target=""

          check_app() {
            local response
            systemctl is-active --quiet baby-growth-desk.service || return 1
            response=$(curl --fail --silent --max-time 5 \
              "http://127.0.0.1:${app_port}${app_base_path}/" 2>/dev/null) || return 1
            grep -q '糖糖成长工作台' <<< "$response" || return 1
            curl --fail --silent --max-time 5 \
              "http://127.0.0.1:${app_port}${app_base_path}/api/health" \
              | grep -q '"database":"mariadb"'
          }

          wait_for_app() {
            local attempt
            for attempt in $(seq 1 30); do
              if check_app; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          show_diagnostics() {
            echo 'ECS service diagnostics:' >&2
            systemctl status baby-growth-desk.service --no-pager >&2 || true
            journalctl -u baby-growth-desk.service -n 80 --no-pager >&2 || true
            ss -ltn >&2 || true
            curl --verbose --max-time 5 \
              "http://127.0.0.1:${app_port}${app_base_path}/" >&2 || true
          }

          case "$release" in
            "$deploy_path/releases/"*) ;;
            *) echo 'Release path escaped the project root' >&2; exit 1 ;;
          esac
          test -s "$archive"
          if tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Release archive contains an unsafe path' >&2
            exit 1
          fi
          if [[ -e "$release" ]]; then
            echo 'Release directory already exists' >&2
            exit 1
          fi

          install -d -m 755 "$release"
          tar -xzf "$archive" -C "$release"
          test -s "$release/server.js"
          test -s "$release/dist/server/index.js"
          test -d "$release/dist/client"
          test -d "$release/node_modules/vinext"
          node --check "$release/server.js"

          if [[ -L "$current_link" ]]; then
            current_before=$(readlink -f "$current_link")
            case "$current_before" in
              "$deploy_path/releases/"*) test -d "$current_before" ;;
              *) echo 'Current release points outside the project root' >&2; exit 1 ;;
            esac
          elif [[ -e "$current_link" ]]; then
            echo 'Current path exists but is not a symlink' >&2
            exit 1
          fi

          if [[ -s "$known_good_file" ]]; then
            IFS= read -r rollback_target < "$known_good_file"
            case "$rollback_target" in
              "$deploy_path/releases/"*) test -d "$rollback_target" ;;
              *) echo 'Recorded known-good release is invalid' >&2; exit 1 ;;
            esac
          fi
          if [[ -n "$current_before" ]] && check_app; then
            rollback_target=$current_before
          fi

          if [[ -e "$next_link" || -L "$next_link" ]]; then
            test -L "$next_link"
            rm -- "$next_link"
          fi
          ln -s "$release" "$next_link"
          mv -Tf "$next_link" "$current_link"

          rollback() {
            if [[ -n "$rollback_target" && -d "$rollback_target" ]]; then
              ln -sfn "$rollback_target" "$next_link"
              mv -Tf "$next_link" "$current_link"
              if sudo -n /usr/bin/systemctl restart baby-growth-desk.service && wait_for_app; then
                echo "Rolled back to verified release $(basename "$rollback_target")" >&2
              else
                echo 'The verified rollback release did not recover successfully' >&2
                show_diagnostics
              fi
            else
              echo 'No verified previous release is available for rollback' >&2
            fi
          }

          if ! sudo -n /usr/bin/systemctl restart baby-growth-desk.service; then
            show_diagnostics
            rollback
            exit 1
          fi
          if ! wait_for_app; then
            show_diagnostics
            rollback
            exit 1
          fi

          if [[ -n "$rollback_target" ]]; then
            printf '%s\n' "$rollback_target" > "$known_good_file"
          else
            : > "$known_good_file"
          fi
          rm -- "$archive"

          current=$(readlink -f "$current_link")
          while IFS= read -r -d '' candidate; do
            if [[ "$candidate" != "$current" && "$candidate" != "$rollback_target" ]]; then
              case "$candidate" in
                "$deploy_path/releases/"*) rm -rf -- "$candidate" ;;
                *) echo 'Refusing to remove a path outside releases' >&2; exit 1 ;;
              esac
            fi
          done < <(find "$deploy_path/releases" -mindepth 1 -maxdepth 1 -type d -print0)
          REMOTE

      - name: Verify public route
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "http://$DEPLOY_HOST$APP_BASE_PATH/" | grep -q '糖糖成长工作台'
          curl --fail --silent --show-error --max-time 20 \
            "http://$DEPLOY_HOST$APP_BASE_PATH/api/health" | grep -q '"database":"mariadb"'

      - name: Remove temporary key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key"
