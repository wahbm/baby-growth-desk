deployment_handoff:
  status: requires_authorized_server_configuration
  repository: "wahbm/baby-growth-desk"
  deployment_branch: "main"
  workflow_file: ".github/workflows/deploy-ecs.yml"
  public_url: "http://8.130.116.192/liangliang-developer/baby-growth-desk/"
  ecs_target:
    public_ip_or_domain: "8.130.116.192"
    access_required: "Alibaba Cloud Workbench or SSH with sudo"
  current_state:
    github_actions: "configured after deployment PR merge"
    nginx: "installed; exact project include still required"
    mariadb: "shared native instance; baby_growth_desk creation reported complete by the user, runtime connectivity pending deployment verification"
    resource_check: "Ubuntu 24.04; Node 22; Nginx 1.24; about 970 MiB available RAM, 4 GiB swap, and 29 GiB free disk"
  deployment:
    deploy_path: "/var/www/liangliang-developer/baby-growth-desk"
    release_strategy: "atomic_current_symlink"
    rollback: "automatic local-health rollback to the previous known-good release"
    persistent_data: "MariaDB database baby_growth_desk; legacy browser localStorage is imported once and removed only after a successful database merge"
    runtime_model: "systemd"
    service_listen: "127.0.0.1:3101"
    expected_resources: "Node service limit raised to 288 MiB for the MariaDB driver and four-connection pool; shared native MariaDB adds no second database process; retain current plus one known-good release"
    database:
      engine: "shared native MariaDB"
      database_name: "baby_growth_desk"
      runtime_user: "baby_growth_desk_app@127.0.0.1 with project-database-only grants"
      network: "127.0.0.1:3306 only; never expose through the security group or Nginx"
      schema: "deploy/mariadb/schema.sql; also initialized idempotently by the application"
      migration_safety: "legacy localStorage JSON is merged by stable record ID after login and removed only after commit; do not clear browser data before verification"
      backup: "declined by the user on 2026-08-24; this production cutover has no configured database recovery point"
  required_actions:
    - "Create /var/www/liangliang-developer/baby-growth-desk/{incoming,releases} owned by deploy:deploy; keep the project root owned by deploy:deploy."
    - "Verify the user-created shared MariaDB database, utf8mb4 schema, local-only project user, and localhost-only listener; measure RAM and swap before and after this project is enabled."
    - "Install deploy/baby-growth-desk.env.example as /etc/baby-growth-desk.env owned by root:root with mode 0600; set distinct random DB_PASSWORD and APP_ACCESS_TOKEN values on the server only."
    - "Install deploy/systemd/baby-growth-desk.service as /etc/systemd/system/baby-growth-desk.service, run systemctl daemon-reload, and enable it without starting it before the first release."
    - "Validate deploy/sudoers/baby-growth-desk-deploy with visudo, then install it as /etc/sudoers.d/baby-growth-desk-deploy with mode 0440."
    - "Install deploy/nginx/baby-growth-desk-location.conf as /etc/nginx/snippets/baby-growth-desk-location.conf and add one exact include inside the existing HTTP server block for 8.130.116.192."
    - "Run nginx -t immediately before reload; reload only on success. Preserve every unrelated route and service."
    - "Record that the user approved direct deployment without MariaDB backups on 2026-08-24; do not create a scheduled backup implicitly."
    - "Set repository variable DEPLOY_ENABLED to true only after the directory, MariaDB, protected environment file, systemd unit, narrow sudo rule, and Nginx include are ready, then run the Deploy ECS workflow."
  verification:
    - "Confirm the workflow commit matches main and that PR events build without deploying."
    - "Confirm baby-growth-desk.service is active and bound only to 127.0.0.1:3101."
    - "Confirm GET /liangliang-developer/baby-growth-desk/api/health returns 200 with database=mariadb, while unauthenticated GET /api/records returns 401 without record data."
    - "Log in with the server-configured family access token, create/edit/delete one temporary Unicode record, and verify it survives a service restart."
    - "On a browser that contains legacy data, verify counts and representative records after the one-time merge before clearing any browser or database backup."
    - "Confirm the exact public URL returns 200 and its avatar, manifest, service worker, and JS/CSS assets also return 200."
    - "Confirm current points into releases, known-good-release records the rollback target after the second successful release, and only two releases remain."
    - "Recheck RAM, swap, disk, Nginx, and browser console after deployment."
  prohibitions:
    - "Do not overwrite another project, expose port 3101 or MariaDB publicly, install dependencies on ECS, reuse database credentials from another project, change the CloudBase root proxy, or delete persistent data."
  report_back:
    - "Completed and skipped actions, workflow run URL and commit, release and rollback state, public URL, resource headroom, and remaining domain/HTTPS work."
